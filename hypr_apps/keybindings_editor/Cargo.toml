[package]
name = "keybindings_editor"
version = "2.0.0"
edition = "2024"

[[bin]]
name = "keybindings_editor-bin"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11.4", features = ["v4_12"] }
hypr_config_manager = { version = "2.0.0", path = "../../hypr_config_manager" }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
yaml_serde = "0.10.4"
glib = { version = "0.22.8", features = ["v2_88"] }
gio = { version = "0.22.8", package = "gio", features = ["v2_88"] }
once_cell = "1.21.4"
fuzzy-matcher = "0.3.7"
