{% from "partials/fonts.j2" import font_family, font_size, font_style %}
# Aesthetics
hide_window_decorations no
window_padding_width {{ theme.kitty.padding | default(25) }}

background_opacity {{ theme.kitty.opacity | default(0.97) }}
background_blur      50

# Cursor Shape
cursor_shape {{ theme.kitty.cursor_shape | default("underline") }}
cursor_trail {{ theme.kitty.cursor_trail | default(200) }}
cursor_trail_decay {{ theme.kitty.cursor_trail_decay | default("0.1 0.4") }}
cursor_trail_start_threshold 2

#cursor_beam_thickness 3
cursor_underline_thickness 2.0
cursor_blink_interval {{ theme.kitty.cursor_blink_interval | default(-1) }}
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines {{ theme.kitty.scrollback | default(2000) }}

mouse_hide_wait 5.0

# Use zsh
shell zsh

# No stupid close confirmation
confirm_os_window_close {{ -1 if (theme.kitty.confirm_close | default(false) or (theme.kitty.confirm_os_window_close | default(0) | int != 0)) else 0 }}

# Copy for normies
#map ctrl+c          copy_to_clipboard
#map ctrl+v          paste_from_clipboard
map ctrl+insert      copy_to_clipboard
map shift+insert     paste_from_clipboard

# Search
#map ctrl+f      launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
#map kitty_mod+f launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up             scroll_page_up
map page_down           scroll_page_down

# Zoom
map ctrl+plus        change_font_size all +1
map ctrl+equal       change_font_size all +1
map ctrl+kp_add      change_font_size all +1

map ctrl+minus       change_font_size all -1
map ctrl+underscore  change_font_size all -1
map ctrl+kp_subtract change_font_size all -1

map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

# Allow remote control so that the theme can be changed on the fly
allow_remote_control yes

# Include the theme file
include theme.conf

# BEGIN_KITTY_FONTS
font_family      family="{{ font_family() }}"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
font_size {{ font_size(theme.kitty.font_size, 13.0) }}
text_composition_strategy 1.0 30

