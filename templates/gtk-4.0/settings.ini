[Settings]
gtk-theme-name={{ theme.gtk.theme if theme.gtk.color_scheme != 'prefer-dark' or theme.gtk.theme != 'Adwaita' else 'Adwaita-dark' }}
gtk-icon-theme-name={{ theme.gtk.icon_theme | default('Adwaita') }}
gtk-cursor-theme-name={{ theme.cursor.theme | default('Adwaita') }}
gtk-cursor-theme-size={{ theme.cursor.size | default(24) }}
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

