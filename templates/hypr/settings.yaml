# Hyprland User Settings (V2)
# Non-theme related preferences (keybindings, gaps, monitors, input, etc.) go here.
# These settings override theme-specific configurations.

monitors: []

fonts:
  size: 12.0
kitty:
  font_size: 12.0
  padding: 25
  scrollback: 4000
  opacity: 0.9
  confirm_os_window_close: 0
  cursor_blink_interval: 0.5
  cursor_shape: underline
  cursor_trail: 1
  cursor_trail_decay: 0.1 0.4
alacritty:
  font_size: 12.0
  padding_x: 25
  padding_y: 25
  opacity: 0.9
  cursor_shape: Block
layout:
  gaps_in: 15
  gaps_out: 15
  rounding: 3
  border_size: 2
  shadow_range: 30
  shadow_power: 3
  blur_size: 7
  blur_passes: 2
  blur_vibrancy: 1.0
  animation_style: cyberpunk
  shadow_offset: 7 7
  groupbar_font_size: 10
  groupbar_height: 16
  allow_tearing: false
  animation_windows_curve: 0.05, 0.9, 0.1, 1.1
  animation_windows_speed: 6
  animation_fade_speed: 6
  animation_workspaces_speed: 6
  animation_windows_enabled: true
  animation_windows_out_enabled: true
  animation_workspaces_enabled: true
  animation_border_enabled: true
  animation_fade_enabled: true
  animations_enabled: true
  blur_enabled: true
  glow_enabled: true
  glow_range: 10
  dim_inactive: false
  dim_strength: 0.2
  groupbar_enabled: true
  groupbar_gradients: false
  groupbar_render_titles: true
  groupbar_scrolling: true
  groupbar_stacked: false
  master_mfact: null
  master_new_on_active: null
  master_new_on_top: null
  master_new_status: master
  master_orientation: null
  name: dwindle
  smart_gaps: 1
  split_width_multiplier: 1.0
  preserve_split: false
  smart_split: false
  force_split: 2
  precise_mouse_move: true
  scrolling_column_width: 0.5
  scrolling_direction: right
  scrolling_focus_fit_method: 1
  scrolling_follow_focus: true
  scrolling_follow_min_visible: 0.0
  scrolling_fullscreen_on_one_column: true
  shadow_enabled: true
  workspace_layouts: null
input:
  touchpad_scroll_factor: 2.5
  sensitivity: 0.1
  follow_mouse: 1
  kb_layout: us
  kb_options: ''
  main_mod: SUPER
  scroll_factor: 2.5
  touchpad_natural_scroll: false
plugins:
  hyprglass:
    enabled: false
    repository: "https://github.com/hyprnux/hyprglass"
    glass_opacity: 0.85
    blur_strength: 2.0
    blur_iterations: 3
    refraction_strength: 0.6
    chromatic_aberration: 0.5
    fresnel_strength: 0.6
    specular_strength: 0.8
    edge_thickness: 0.06
    tint_color: "0x8899aa22"
    brightness: 0.9
    contrast: 1.0
    manage_window_blur: true
    layer_waybar: true
    layer_walker: true
    layer_mako: true
modules:
  waybar:
    enabled: true
    right:
    - custom/update
    - privacy
    - group/hardware
    - custom/playerctl
    - tray
    - custom/clipboard
    - custom/notifications
    - custom/power
    center:
    - hyprland/submap
    - group/datetime
    height: 34
    left:
    - custom/hypr
    - hyprland/workspaces
    margin_bottom: 0
    margin_left: 0
    margin_right: 0
    margin_top: 0
    position: top
    spacing: 0
    workspaces:
      active_only: false
      all_outputs: true
      format: '{icon}'
      icons:
        '1': "\U000F016C SHELL"
        '2': "\uF268 NET"
        '3': "\uF126 CODE"
        '4': "\uF075 COMMS"
        '5': "\U000F0296 PLAY"
        '6': "\U000F039E NOTES"
        '7': "\uF4D3 FILES"
        '8': "\U000F0483 SEC"
        '9': "\uF2EB MEDIA"
      persistent:
        '*': 4
      show_special: false
  mako:
    enabled: true
gtk:
  color_scheme: prefer-dark
  gdk_scale: 1
  gdk_dpi_scale: 1.0
  qt_scale_factor: 1.0
  text_scaling_factor: 1.0
hypr:
  window:
    size:
      creator: 1500 700
      floating: 1100 800
      dialog: 900 600
      editor: 1000 700
    opacity:
      active: 0.99
      inactive: 0.98
    workspace_assignment:
      browsers: true
      coding: true
      communications: true
      media: true
    animation:
      browsers: slide
      coding: slide
      communications: slide
      media: slide
    suppress_maximize: true
  idle:
    dpms_timeout: 4300
    lock_timeout: 4200
    timeout: 4100
ghostty:
  font_size: 12.0
  opacity: 0.95
  padding: 25
  cursor_shape: block
  copy_on_select: clipboard
cursor:
  size: 24
mako:
  font_size: 13
  margin: 20
  padding: 15
  timeout: 5000
nvim:
  padding: 10
swayosd:
  font_size: 14
voxtype:
  enabled: true
  language: en
  mode: type
  model: base.en
  notifications:
    recording_start: true
    recording_stop: true
    transcription: true
walker:
  font_size: 19
  width: 644
  max_height: 600
waybar:
  style:
    border_radius: 10
    margin: 2
    padding: 2
    size: 16
