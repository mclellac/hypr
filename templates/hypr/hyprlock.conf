{% from "partials/fonts.j2" import font_family, font_size, font_style %}
source = ~/.config/hypr/theme-hyprlock.conf

background {
    monitor =
    color = $color
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 600, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = {{ theme.layout.border_size }}

    font_family = {{ font_family() }}
    font_color = $font_color

    placeholder_text =   Enter Password 󰈷 
    check_color = $check_color
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>

    rounding = {{ theme.layout.rounding | default(0) }}
    shadow_passes = {{ 1 if theme.layout.shadow_enabled else 0 }}
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}
