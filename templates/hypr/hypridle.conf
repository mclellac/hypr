general {
    lock_cmd = hypr-lock-screen                         # lock screen and 1password
    before_sleep_cmd = loginctl lock-session            # lock before suspend.
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'          # to avoid having to press a key twice to turn on the display.
    inhibit_sleep = 3                                   # wait until screen is locked
}

listener {
    timeout = {{ theme.hypr.idle.timeout | default(4100) }}
    #timeout = 150                                             # 2.5min
    on-timeout = pidof hyprlock || hypr-launch-screensaver # start screensaver (if we haven't locked already)
}

listener {
    timeout = {{ theme.hypr.idle.lock_timeout | default(4200) }}
    #timeout = 300                      # 5min
    on-timeout = loginctl lock-session # lock screen when timeout has passed
}

listener {
    timeout = {{ theme.hypr.idle.dpms_timeout | default(4300) }}
    #timeout = 330                                            # 5.5min
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'                   # screen off when timeout has passed
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))' && brightnessctl -r # screen on when activity is detected
}
