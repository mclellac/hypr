alacritty:
  cursor_shape: Block
  font_size: 13.0
  opacity: 1.0
  padding_x: 0
  padding_y: 0
colors:
  background: '#1a2529'
  foreground: '#CEE2E4'
  cursor: '#A3D6DC'
  cursor_text: '#1a2529'
  selection_bg: '#2A4B55'
  selection_fg: '#CEE2E4'
  primary: '#A3D6DC'
  secondary: '#87AFBC'
  accent: '#E3AA6D'
  alert: '#E3AA6D'
  warning: '#E4D285'
  success: '#4DDCC4'
  color0: '#243339'
  color1: '#E3AA6D'
  color2: '#4DDCC4'
  color3: '#E4D285'
  color4: '#87AFBC'
  color5: '#BCE1E6'
  color6: '#A0D0D6'
  color7: '#B6C2C4'
  color8: '#2A4B55'
  color9: '#E3AA6D'
  color10: '#4DDCC4'
  color11: '#E4D285'
  color12: '#87AFBC'
  color13: '#BCE1E6'
  color14: '#A0D0D6'
  color15: '#CEE2E4'
cursor:
  size: 24
  theme: Adwaita
fonts:
  font_family: AdwaitaMonoNerdFont
  font_style: Regular
ghostty:
  cursor_shape: block
  font_size: 13.0
  opacity: 1.0
  padding: 14
  copy_on_select: ""
gtk:
  color_scheme: prefer-dark
  icon_theme: Adwaita
  accent_color: blue
  theme: Adwaita
  gdk_scale: 1
  gdk_dpi_scale: 1.0
  qt_scale_factor: 1.0
  text_scaling_factor: 1.0
hypr:
  idle:
    dpms_timeout: 4300
    lock_timeout: 4200
    timeout: 4100
  window:
    opacity:
      active: 0.99
      inactive: 0.98
    size:
      creator: 1100 700
      dialog: 900 600
      editor: 1000 700
      floating: 1200 800
    workspace_assignment:
      browsers: true
      coding: true
      communications: true
      media: true
      notes: true
    animation:
      browsers: slide
      coding: slide
      communications: slide
      media: slide
      notes: slide
    suppress_maximize: true
  sunset:
    temperature: 6000
hyprlock: {}
input:
  follow_mouse: 1
  kb_layout: us
  kb_options: "compose:caps"
  main_mod: SUPER
  sensitivity: 0.0
  scroll_factor: 2.5
  touchpad_scroll_factor: 1.0
  touchpad_natural_scroll: false
  touchpad_tap_to_click: true
  touchpad_enabled: true
kitty:
  confirm_close: false
  confirm_os_window_close: 0
  cursor_blink_interval: 0.5
  cursor_shape: underline
  cursor_trail: 1
  cursor_trail_decay: 0.1 0.4
  font_size: 13.0
  opacity: 1.0
  padding: 0
  scrollback: 2000
layout:
  active_border: rgba(33ccffee) rgba(00ff99ee) 45deg
  allow_tearing: false
  animation_style: fluid
  animation_windows_curve: 0.05, 0.9, 0.1, 1.05
  animation_windows_speed: 5
  animation_fade_speed: 5
  animation_workspaces_speed: 5
  animation_windows_enabled: true
  animation_windows_out_enabled: true
  animation_workspaces_enabled: true
  animation_border_enabled: true
  animation_fade_enabled: true
  animations_enabled: true
  blur_enabled: true
  blur_passes: 1
  blur_size: 2
  blur_vibrancy: 0.1696
  glow_enabled: false
  glow_range: 10
  glow_color: rgba(1a1a1aee)
  border_size: 2
  dim_inactive: false
  dim_strength: 0.2
  gaps_in: 8
  gaps_out: 8
  group_border_active: '0x66ffff00'
  group_border_inactive: '0x66777700'
  group_border_locked_active: '0x66ff5500'
  group_border_locked_inactive: '0x66775500'
  groupbar_col_active: '0x66ffff00'
  groupbar_col_inactive: '0x66777700'
  groupbar_col_locked_active: '0x66ff5500'
  groupbar_col_locked_inactive: '0x66775500'
  groupbar_enabled: true
  groupbar_font_size: 8
  groupbar_gradients: false
  groupbar_height: 14
  groupbar_render_titles: true
  groupbar_scrolling: true
  groupbar_stacked: false
  groupbar_text_color: '0xffffffff'
  inactive_border: rgba(595959aa)
  master_mfact:
  master_new_on_active:
  master_new_on_top:
  master_new_status: master
  master_orientation:
  name: dwindle
  nogroup_border: '0xffffaaff'
  nogroup_border_active: '0xffff00ff'
  smart_gaps: 1
  split_width_multiplier: 1.0
  preserve_split: false
  smart_split: false
  force_split: 2
  precise_mouse_move: true
  rounding: 10

  scrolling_column_width: 0.5
  scrolling_direction: right
  scrolling_focus_fit_method: 1
  scrolling_follow_focus: true
  scrolling_follow_min_visible: 0.0
  scrolling_fullscreen_on_one_column: true
  shadow_color: rgba(1a1a1aee)
  shadow_enabled: true
  shadow_offset: 0 5
  shadow_power: 4
  shadow_range: 15
  workspace_layouts: {}
mako:
  font_size: 13
  margin: 20
  padding: 15
  timeout: 5000
modules:
  waybar:
    center:
      - hyprland/submap
      - group/datetime
    height: 34
    left:
      - custom/hypr
      - hyprland/workspaces
    margin_bottom: 0
    margin_left: 0
    margin_right: 0
    margin_top: 0
    position: top
    right:
      - custom/update
      - privacy
      - group/hardware
      - custom/playerctl
      - tray
      - custom/notifications
      - custom/clipboard
      - custom/power
    spacing: 0
    workspaces:
      active_only: false
      all_outputs: true
      format: '{icon}'
      icons:
        '1': '󰅬 SHELL'
        '2': ' NET'
        '3': ' CODE'
        '4': ' COMMS'
        '5': '󰊖 PLAY'
        '6': '󰎞 NOTES'
        '7': ' FILES'
        '8': '󰒃 SEC'
        '9': ' MEDIA'
      persistent:
        '*': 6
      show_special: false
nvim:
  padding: 10
  colorscheme: cyberdream
swappy: {}
swayosd:
  font_size: 14
terminal: ghostty
voxtype:
  enabled: true
  language: en
  mode: type
  model: base.en
  notifications:
    recording_start: true
    recording_stop: true
    transcription: true
walker:
  font_size: 19
  width: 1000
  max_height: 600
  opacity: 0.95
  mod_clipboard: true
  mod_snippets: true
  mod_symbols: true
waybar:
  colors:
    hardware_border: rgba(80, 80, 80, 0.88)
  style:
    border_radius: 10
    margin: 2
    padding: 2
    size: 16

monitors: []

keybindings:
  - type: bindd
    mods: $mainMod
    key: R
    desc: Toggle Dictation
    dispatcher: exec
    arg: voxtype record toggle
    category: Application bindings
  - type: bindd
    mods: $mainMod
    key: return
    desc: Launch Terminal
    dispatcher: exec
    arg: $terminal --working-directory=$(hypr-cmd-terminal-cwd)
