    dispatcher: exec
    arg: hypr-menu system
    category: Launchers
  - type: bindld
    mods: ''
    key: XF86PowerOff
    desc: Power menu
    dispatcher: exec
    arg: hypr-menu system
    category: Launchers
  - type: bindd
    mods: $mainMod
    key: K
    desc: Keybindings Menu
    dispatcher: exec
    arg: hypr-menu-keybindings
    category: Launchers
  - type: bindd
    mods: $mainMod CTRL
    key: W
    desc: Toggle Waybar
    dispatcher: exec
    arg: pkill -SIGUSR1 waybar
    category: Aesthetics
  - type: bindd
    mods: $mainMod CTRL
    key: SPACE
    desc: Next Wallpaper
    dispatcher: exec
    arg: hypr-theme-bg-next
    category: Aesthetics
  - type: bindd
    mods: $mainMod
    key: COMMA
    desc: Dismiss Notification
    dispatcher: exec
    arg: makoctl dismiss
    category: Notifications
  - type: bindd
    mods: $mainMod SHIFT
    key: COMMA
    desc: Dismiss All Notifications
    dispatcher: exec
    arg: makoctl dismiss --all
    category: Notifications
  - type: bindd
    mods: $mainMod CTRL
    key: COMMA
    desc: Toggle Notification Silence
    dispatcher: exec
    arg: makoctl mode -t do-not-disturb && makoctl mode | grep -q 'do-not-disturb'
      && notify-send "Silenced notifications" -t 5000 || notify-send "Enabled notifications"
      -t 5000
    category: Notifications
  - type: bindd
    mods: $mainMod CTRL
    key: I
    desc: Toggle Idle Lock
    dispatcher: exec
    arg: hypr-toggle-idle
    category: Toggle idling
  - type: bindd
    mods: $mainMod CTRL
    key: N
    desc: Toggle Night Light
    dispatcher: exec
    arg: hypr-toggle-nightlight
    category: Toggle nightlight
  - type: bindd
    mods: $mainMod CTRL
    key: '4'
    desc: Screenshot Region
    dispatcher: exec
    arg: hypr-cmd-screenshot
    category: System
  - type: bindd
    mods: $mainMod CTRL
    key: '5'
    desc: Screenshot Window
    dispatcher: exec
    arg: hypr-cmd-screenshot window
    category: System
  - type: bindd
    mods: $mainMod CTRL
    key: '3'
    desc: Screenshot Display
    dispatcher: exec
    arg: hypr-cmd-screenshot output
    category: System
  - type: bindd
    mods: $mainMod CTRL
    key: '6'
    desc: Record Screen Region
    dispatcher: exec
    arg: hypr-cmd-screenrecord
    category: Screen recordings
  - type: bindd
    mods: $mainMod CTRL
    key: '7'
    desc: Record Screen Display
    dispatcher: exec
    arg: hypr-cmd-screenrecord output
    category: Screen recordings
  - type: bindd
    mods: $mainMod CTRL
    key: P
    desc: Color Picker
    dispatcher: exec
    arg: pkill hyprpicker || hyprpicker -a
    category: Color picker
  - type: bindldn
    mods: ''
    key: Caps_Lock
    desc: Caps Lock
    dispatcher: exec
    arg: hypr-caps-lock-osd
    category: System
  - type: bindd
    mods: $mainMod
    key: G
    desc: Launch Google Meet
    dispatcher: exec
    arg: hypr-launch-webapp "https://meet.google.com/"
    category: Web Applications

plugins:
  hyprglass:
    enabled: false
    repository: "https://github.com/hyprnux/hyprglass"
    glass_opacity: 0.85
    blur_strength: 2.0
    blur_iterations: 3
    refraction_strength: 0.6
    chromatic_aberration: 0.5
    fresnel_strength: 0.6
    specular_strength: 0.8
    edge_thickness: 0.06
    tint_color: "0x8899aa22"
    brightness: 0.9
    contrast: 1.0
    manage_window_blur: true
    layer_waybar: true
    layer_walker: true
    layer_mako: true

