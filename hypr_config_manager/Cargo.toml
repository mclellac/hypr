[[bin]]
name = "hypr-theme-templater-bin"
path = "src/bin/theme_templater.rs"

[[bin]]
name = "hypr-theme-get-bin"
path = "src/bin/theme_get.rs"

[package]
name = "hypr_config_manager"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
regex = "1.13.1"
yaml_serde = "0.10.4"
once_cell = "1.21.4"
config = "0.15.25"
minijinja = { version = "2.21.0", features = ["json", "loader"] }
serde_json = "1.0.151"
walkdir = "2.5.0"

[dependencies.serde]
version = "1.0.229"
features = [
    "derive",
]

[dependencies.clap]
version = "4.6.4"
features = [
    "derive",
]
